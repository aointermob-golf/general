---
layout: default
---
<article class="section post">
  <div class="container post-container">
    <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%-d %B %Y" }}
      {% if page.read_time %} · {{ page.read_time }} min read{% endif %}
    </p>
    <div class="post-body">
      {{ content }}
    </div>
    <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
  </div>
</article>
